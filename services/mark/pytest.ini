[pytest]
pythonpath = .
testpaths = tests
addopts = -p no:cacheprovider
markers =
    m1: milestone 1 -- the read operations (tasks K1, K2, K3)
    m2: milestone 2 -- bulk submission of marks (task F3)
    m3: milestone 3 -- moderation and approval (task F4)
    m4: milestone 4 -- security tests: 401 and 403 (task K4)
    m5: milestone 5 -- the HTTP client of the Script service: timeouts and retries (task K5)
    contract: the application serves exactly the operations of the specification
